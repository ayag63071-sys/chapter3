<script>
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function renderQuiz(containerId, questions) {
        const container = document.getElementById(containerId);
        if(!container) return;
        container.innerHTML = '';
        let selections = new Array(questions.length).fill(null);
        questions.forEach((q, idx) => {
            const card = document.createElement('div'); card.className = 'quiz-card';
            const qDiv = document.createElement('div'); qDiv.className = 'question-text';
            qDiv.innerHTML = `<span class="q-num">Q${idx+1}</span> ${escapeHtml(q.text)}`;
            card.appendChild(qDiv);
            const optsDiv = document.createElement('div'); optsDiv.className = 'options';
            q.options.forEach((opt, optIdx) => {
                const optWrap = document.createElement('div'); optWrap.className = 'option';
                const radioId = `q_${containerId}_${idx}_${optIdx}`;
                const radio = document.createElement('input'); radio.type = 'radio'; radio.name = `q_${containerId}_${idx}`; radio.value = optIdx; radio.id = radioId;
                radio.addEventListener('change', () => { selections[idx] = optIdx; });
                const label = document.createElement('label'); label.htmlFor = radioId; label.innerText = opt;
                optWrap.appendChild(radio); optWrap.appendChild(label); optsDiv.appendChild(optWrap);
            });
            card.appendChild(optsDiv);
            const btn = document.createElement('button'); btn.innerText = 'Check'; btn.className = 'btn-submit';
            btn.addEventListener('click', () => {
                const selected = selections[idx];
                if(selected === undefined || selected === null) {
                    const temp = document.createElement('div'); temp.className = 'feedback wrong';
                    temp.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please select an answer first';
                    const old = card.querySelector('.feedback'); if(old) old.remove(); card.appendChild(temp);
                    setTimeout(() => { if(temp.parentNode) temp.remove(); }, 1500);
                    return;
                }
                const isCorrect = (selected === q.correct);
                const fb = document.createElement('div'); fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
                if(isCorrect) fb.innerHTML = `<i class="fas fa-check-circle"></i> ✅ Correct<br><div>📘 ${escapeHtml(q.wrongExplanationAr)}</div>`;
                else fb.innerHTML = `<i class="fas fa-times-circle"></i> ❌ Incorrect. Correct: <strong>${escapeHtml(q.options[q.correct])}</strong><br><div>📌 ${escapeHtml(q.wrongExplanationAr)}</div>`;
                const oldFb = card.querySelector('.feedback'); if(oldFb) oldFb.remove(); card.appendChild(fb);
            });
            card.appendChild(btn);
            container.appendChild(card);
        });
    }
    function renderTranslations(containerId, exercises) {
        const container = document.getElementById(containerId);
        if(!container) return;
        container.innerHTML = '';
        exercises.forEach((ex, idx) => {
            const item = document.createElement('div'); item.className = 'trans-item';
            const prompt = document.createElement('div'); prompt.className = 'trans-prompt';
            prompt.innerHTML = ex.type === 'ar2en' ? `<i class="fas fa-long-arrow-alt-right"></i> ${escapeHtml(ex.text)}` : `<i class="fas fa-long-arrow-alt-left"></i> <span style="direction:ltr">${escapeHtml(ex.text)}</span>`;
            const textarea = document.createElement('textarea'); textarea.rows = 2; textarea.className = 'trans-input'; textarea.placeholder = 'اكتب ترجمتك...';
            const feedback = document.createElement('div'); feedback.className = 'trans-feedback';
            const btn = document.createElement('button'); btn.innerText = 'Check'; btn.className = 'trans-btn';
            btn.addEventListener('click', () => {
                const user = textarea.value.trim();
                let correctAnswer = ex.type === 'ar2en' ? ex.correctEn : ex.correctAr;
                let normUser = user.replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').toLowerCase();
                let normCorrect = correctAnswer.replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').toLowerCase();
                let isMatch = normUser === normCorrect || (normCorrect.includes(normUser) && normUser.length > 12) || (normUser.includes(normCorrect.substring(0,35)));
                feedback.innerHTML = isMatch ? '<span style="color:#4c8b4a;">✅ ترجمة صحيحة</span>' : `<span style="color:#c2594b;">❌ الإجابة النموذجية: ${escapeHtml(correctAnswer)}</span>`;
            });
            item.appendChild(prompt); item.appendChild(textarea); item.appendChild(btn); item.appendChild(feedback);
            container.appendChild(item);
        });
    }

    const transCh3 = [
        { type: "ar2en", text: "التخلف العقلي هو اضطراب وراثي يظهر في صورة انخفاض ملحوظ عن المتوسط في القدرة العقلية العامة", correctEn: "Mental retardation is a genetic disorder manifested in significantly below average overall intellectual functioning" },
